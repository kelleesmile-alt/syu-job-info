*{box-sizing:border-box} body{margin:0;background:#eef2f7;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}

.empty{text-align:center;padding:45px 15px;color:var(--muted);background:#fff;border-radius:18px}
